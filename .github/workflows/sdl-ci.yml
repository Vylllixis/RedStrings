name: sdl-ci

on:
  push:
    paths: ['sdl/**', '.github/workflows/sdl-ci.yml']
  pull_request:
    paths: ['sdl/**', '.github/workflows/sdl-ci.yml']
  workflow_dispatch: # lancement à la main depuis l'onglet Actions

permissions:
  contents: read

concurrency:
  group: sdl-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: sdl

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Dépendances Linux (SDL3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libudev-dev libasound2-dev libpulse-dev \
            clang-format-18 clang-tidy-18
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v clang-format-18)" "$HOME/bin/clang-format"
          ln -sf "$(command -v clang-tidy-18)" "$HOME/bin/clang-tidy"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Environnement MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurer
        run: cmake --preset ${{ matrix.preset }}

      - name: Compiler
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Tests (ctest)
        # en série : les tests du lanceur chargent le compilateur de shaders et se gênent en parallèle
        run: ctest --preset ${{ matrix.preset }}

      # Exécutable Windows (prérequis du paquet de M9) : le dossier bin/ tel que le lanceur le lit
      # (exécutable, game.dll, DLL, shaders compilés, assets cuits, config.ini).
      - name: Artefact Windows (Release)
        if: runner.os == 'Windows' && matrix.preset == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: openworld-windows-release
          path: |
            sdl/build/release/bin/
            !sdl/build/release/bin/logs/
          if-no-files-found: error
          retention-days: 14

      - name: Format (clang-format)
        if: runner.os == 'Linux' && matrix.preset == 'debug'
        run: tools/scripts/format.sh --check

      - name: Analyse statique (clang-tidy)
        if: runner.os == 'Linux' && matrix.preset == 'debug'
        run: tools/scripts/lint.sh

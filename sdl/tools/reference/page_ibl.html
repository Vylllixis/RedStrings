<script type="module">
import * as THREE from 'three';

import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
const MODE=new URLSearchParams(location.search).get('mode')||'A';
const C=THREE.ShaderChunk;
if(MODE==='B'){
 const b="material.roughness = max( roughnessFactor, 0.0525 );";
 const c="material.roughness += geometryRoughness;";
 if(!C.lights_physical_fragment.includes(b)||!C.lights_physical_fragment.includes(c)) throw new Error('chunk B introuvable');

else{hdr.mapping=THREE.EquirectangularReflectionMapping;env=pmrem.fromEquirectangular(hdr).texture;}

# Configuration du jeu : « clé = valeur », une par ligne. « # » ou « ; » commence un commentaire.
# Ce fichier est copié à côté de l'exécutable (build/<preset>/bin/config.ini) à la première
# configuration CMake ; modifie CETTE copie, elle n'est jamais écrasée.
# Fichier absent ou clé absente : valeur par défaut (celles écrites ci-dessous).
# Ligne invalide : avertissement dans le journal avec son numéro, la ligne est ignorée.

# ── Fenêtre ──────────────────────────────────────────────────────────────────
resolution = 1280x720      # LARGEURxHAUTEUR, de 320x200 à 16384x16384
fullscreen = false         # true / false (aussi : yes/no, on/off, 1/0)
vsync = true               # synchronisation verticale

# ── Entrées ──────────────────────────────────────────────────────────────────
mouse_sensitivity = 0.002  # ]0 ; 0.1]
stick_deadzone = 0.2       # [0 ; 0.95] : en dessous, le stick est ignoré (dérive)

# Liaisons : « bind.<action> = source, source, ... » REMPLACE les liaisons par défaut de
# l'action (4 au maximum) ; « none » désactive l'action.
#   key:<nom>      touche, par sa position PHYSIQUE (sur AZERTY, W est à la place du Z) :
#                  W, Space, Left Ctrl, Left Shift, Return, Tab, F5...
#   mouse:<nom>    left, middle, right, x1, x2
#   pad:<nom>      south east west north (ou a b x y), back, guide, start, left_stick,
#                  right_stick, left_shoulder, right_shoulder, dpad_up/down/left/right
#   trigger:<nom>  left, right
# Actions : attack, heavy_attack, dodge, jump, interact, sprint, lock_on, pause
#
# Valeurs par défaut (décommente et change pour modifier) :
# bind.attack = mouse:left, pad:west
# bind.heavy_attack = mouse:right, trigger:right
# bind.dodge = key:Left Ctrl, pad:east
# bind.jump = key:Space, pad:south
# bind.interact = key:E, pad:north
# bind.sprint = key:Left Shift, pad:left_stick
# bind.lock_on = key:Q, pad:right_stick
# bind.pause = key:P, pad:start
#
# Déplacement au clavier : gauche, droite, bas, haut
# bind.move.keys = A, D, S, W
